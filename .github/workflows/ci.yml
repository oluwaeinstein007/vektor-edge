# §9.8: "Every PR: Cross-compile ARM64 -> hardware-in-the-loop tests on a
# physical Jetson runner (nightly, not per-PR)". The per-PR jobs below are
# everything that doesn't need real Jetson hardware; hardware-in-the-loop
# is scheduled separately — see tests/hardware-in-the-loop/README.md, which
# is honest that no runner is wired up yet.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # nightly hardware-in-the-loop, see tests/hardware-in-the-loop/README.md

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scandir: [scripts, map-packs, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ${{ matrix.scandir }}

  # SEC-005 (NW-010). Runs the real provisioning script against a real LUKS2
  # volume on a loopback device and asserts on real cryptsetup output. A
  # GitHub-hosted runner is a full VM, so dm-crypt and losetup both work —
  # this is a genuine run, not a shellcheck pass. What it cannot cover is
  # TPM2 sealing and L4T rootfs encryption, which need the physical board;
  # those are listed for the nightly job in
  # tests/hardware-in-the-loop/README.md.
  luks-sec005:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cryptsetup
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cryptsetup-bin
      - name: LUKS provisioning integration test
        run: sudo ./tests/luks/luks-integration-test.sh

  memory-budget-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      # EDGE-007 in miniature: the checked-in example is what a healthy
      # build looks like, so if this ever fails, either the example or the
      # budget manifest drifted from §11.4 and needs reconciling by hand.
      - run: node dist/src/check-memory-budget.js example-observed.json

  map-pack-build:
    # EDGE-004. Neither tippecanoe nor pmtiles ships an apt package on
    # ubuntu-latest, and tippecanoe has no prebuilt release binary at all —
    # build it from source (same recipe verified locally, see
    # vektor-build-conventions) and fetch pmtiles' real static Go binary
    # release, then actually run the script against a real checked-in
    # GeoJSON fixture rather than just shellchecking it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tippecanoe from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join /usr/local/bin/
      - name: Install pmtiles
        run: |
          curl -sSL -o /tmp/pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar xzf /tmp/pmtiles.tar.gz -C /tmp
          sudo install -m 0755 /tmp/pmtiles /usr/local/bin/pmtiles
      - run: ./map-packs/build-pmtiles-pack.sh map-packs/fixtures/area.geojson /tmp/area.pmtiles
      - run: pmtiles show /tmp/area.pmtiles

  compose-validate:
    runs-on: ubuntu-latest
    env:
      VEKTOR_EDGE_NODE_ID: ci-validate # required var, real value only matters at deploy time
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p compose/models
          docker compose -f compose/docker-compose.edge.yml config -q

  hardware-in-the-loop:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, jetson-agx-orin]
    steps:
      - run: echo "TODO EDGE-002/EDGE-003 — needs the physical runner label above to exist first"
